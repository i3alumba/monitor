# Gamma ONLY, after operator verifies these exact existing telemetry device nodes
# and nvidia-smi as the confined account. No wildcard or compute/control commands.
[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=/dev/nvidiactl rw
DeviceAllow=/dev/nvidia0 rw
# nvidia-smi driver ioctls require rw open; this does NOT make ioctls read-only.
# The binary permits only one fixed telemetry query. Do not broaden devices/groups.
